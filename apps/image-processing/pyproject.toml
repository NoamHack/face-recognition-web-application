[tool.coverage.run]
branch = true
source = [ "image_processing" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=100 --cov-report html:'../../coverage/apps/image-processing/html' --cov-report xml:'../../coverage/apps/image-processing/coverage.xml' --junitxml='../../reports/apps/image-processing/unittests/junit.xml' --html='../../reports/apps/image-processing/unittests/html/index.html'"

[tool.poetry]
name = "apps"
version = "1.0.0"
description = ""
authors = [ ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "image_processing"

  [tool.poetry.dependencies]
  tensorflow-io-gcs-filesystem = "0.31.0"
  tensorflow = "2.15.0"

    [tool.poetry.dependencies.tensorflow-intel]
    version = "^2.15.0"
    platform = "win32"

[build-system]
requires = [ "poetry-core==1.1.0" ]
build-backend = "poetry.core.masonry.api"
