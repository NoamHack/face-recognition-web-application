<div class="card flex justify-content-center">
  <p-speedDial
    [model]="items"
    direction="up"
    [radius]="80"
    type="quarter-circle"
    buttonClassName="p-button-warning"
    [showIcon]="'pi pi-palette'"
    [hideIcon]="'pi pi-times'"
    [transitionDelay]="80"
    ngSkipHydration
    [style]="{'position': 'relative'}"
  ></p-speedDial>
</div>
