<div class="card flex justify-content-center theme-switcher-container">
  <p-speedDial
    [model]="items"
    direction="left"
    type="linear"
    [transitionDelay]="80"
    buttonClassName="p-button-warning custom-speeddial"
    [showIcon]="'pi pi-palette'"
    [hideIcon]="'pi pi-times'"
    ngSkipHydration
    [style]="{'position': 'fixed', 'right': '20px', 'top': '100px'}"
  ></p-speedDial>
</div>
